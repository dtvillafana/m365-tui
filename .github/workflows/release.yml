name: release

# Build and publish a versioned GitHub Release when explicitly dispatched.
# CI dispatches this workflow only after all required checks succeed on main
# and an existing vX.Y.Z tag points at the exact tested commit.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build and publish
        required: true
        type: string
      release_tag:
        description: Existing version tag to publish, for example v1.6.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      commit: ${{ steps.meta.outputs.commit }}

    steps:
      - name: Checkout CI-tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          commit="$REQUESTED_SHA"
          tag="$REQUESTED_TAG"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"

          if [ "$tag" != "v${version}" ]; then
            echo "::error::Tag $tag does not match Cargo.toml version ${version}"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::Checked-out commit does not match requested commit $commit"
            exit 1
          fi

          git fetch --quiet --force origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if [ "$tag_commit" != "$commit" ]; then
            echo "::error::Tag $tag points to $tag_commit, expected $commit"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=m365-tui ${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    env:
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout CI-tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}

      - name: Install Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p m365-tui -p webhook

      - name: Verify the binaries are static
        shell: bash
        run: |
          set -euo pipefail
          for bin in m365 m365-webhook; do
            desc=$(file -b "target/$TARGET/release/$bin")
            echo "$bin: $desc"
            case "$desc" in
              *"dynamically linked"*)
                echo "::error::$bin is dynamically linked"
                exit 1
                ;;
            esac
          done

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          dir="m365-tui-${{ needs.meta.outputs.tag }}"
          asset="m365-tui-${{ matrix.arch }}-linux-musl.tar.gz"

          mkdir -p "dist/$dir/realtime"

          cp "target/$TARGET/release/m365" "dist/$dir/"
          cp "target/$TARGET/release/m365-webhook" "dist/$dir/"
          cp README.md ARCHITECTURE.md LICENSE "dist/$dir/"

          cp deploy/docker-compose.yml deploy/Dockerfile deploy/.env.example \
             deploy/README.md deploy/up.sh deploy/down.sh "dist/$dir/realtime/"

          cp "target/$TARGET/release/m365-webhook" "dist/$dir/realtime/"

          chmod +x "dist/$dir/m365" \
                   "dist/$dir/m365-webhook" \
                   "dist/$dir/realtime/up.sh" \
                   "dist/$dir/realtime/down.sh" \
                   "dist/$dir/realtime/m365-webhook"

          tar -C dist -czf "$asset" "$dir"
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - meta
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Collect every architecture's assets
        uses: actions/download-artifact@v7
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.commit }}
          name: ${{ needs.meta.outputs.name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
