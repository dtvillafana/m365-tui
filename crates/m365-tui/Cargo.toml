[package]
name = "m365-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified terminal client for Outlook and Microsoft Teams over Microsoft Graph."

[[bin]]
name = "m365"
path = "src/main.rs"

[dependencies]
m365-core = { path = "../m365-core" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
ratatui = "0.29"
ratatui-image = { version = "8.1.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
futures-util.workspace = true
html5ever = "0.38"
markup5ever_rcdom = "0.38"
directories.workspace = true

[dev-dependencies]
serde_json.workspace = true
